name: NeuroSys Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Build & Test Backend (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Test Backend
        run: |
          cd neurosys-backend
          mvn clean test-compile

  agent-build-test:
    name: Build & Test Monitoring Agent (Java 21 + OSHI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Monitoring Agent
        run: |
          cd neurosys-agent
          mvn clean test-compile

  ai-service-test:
    name: Test AI Engine (Python FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies & Verify Syntax
        run: |
          cd neurosys-ai
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app/main.py

  frontend-build:
    name: Build React Frontend (Vite + Tailwind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: neurosys-frontend/package.json

      - name: Build Web Application
        run: |
          cd neurosys-frontend
          npm ci
          npm run build

  docker-build-push:
    name: Build Docker Containers
    needs: [backend-build-test, agent-build-test, ai-service-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Compose Stack
        run: |
          docker compose build
